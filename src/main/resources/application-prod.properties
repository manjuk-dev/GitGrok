spring.application.name=GitGrok

spring.ai.model.chat=openai
spring.ai.ollama.chat.enabled=false

# Ollama Configuration (embeddings only ? Groq has no embedding API)
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://mock-ollama}
spring.ai.ollama.embedding.options.model=nomic-embed-text
spring.ai.model.embedding=ollama

# Groq Configuration (chat model, via OpenAI-compatible client)
spring.ai.openai.api-key=${GROQ_API_KEY}
spring.ai.openai.base-url=https://api.groq.com/openai
spring.ai.openai.chat.options.model=openai/gpt-oss-120b
spring.ai.openai.chat.options.temperature=0.0
#spring.ai.openai.chat.options.max-tokens=500
#spring.ai.openai.chat.options.stop=User:,<|end|>,<|endoftext|>
spring.ai.openai.chat.options.stream-usage=false

# Pinecone Configuration
spring.ai.vectorstore.pinecone.apiKey=${PINECONE_API_KEY}
spring.ai.vectorstore.pinecone.index-name=git-grok-index

#DEBUG
logging.level.org.springframework.ai.chat.client.advisor=DEBUG
logging.level.org.springframework.ai.vectorstore=DEBUG
#logging.level.org.springframework.web.reactive.function.client=DEBUG

github.token=${GITHUB_PAT}