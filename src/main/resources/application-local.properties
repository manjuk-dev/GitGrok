spring.application.name=GitGrok
# Ollama Configuration
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://mock-ollama}
spring.ai.ollama.embedding.options.model=nomic-embed-text
spring.ai.model.embedding=ollama
spring.ai.ollama.chat.options.model=qwen2.5-coder:3b
spring.ai.ollama.chat.options.num-thread=2

# Pinecone Configuration
spring.ai.vectorstore.pinecone.apiKey=${PINECONE_API_KEY}
spring.ai.vectorstore.pinecone.index-name=git-grok-index

#DEBUG
logging.level.org.springframework.ai.chat.client.advisor=DEBUG
logging.level.org.springframework.ai.vectorstore=DEBUG

github.token=${GITHUB_PAT}
# Give the CPU 5 minutes to process the context before timing out
spring.ai.ollama.chat.options.timeout=300s
spring.ai.ollama.chat.options.num-predict=500
# Stop if the model tries to start a new chat turn or a new section
spring.ai.ollama.chat.options.stop-sequences=User:,<|end|>,<|endoftext|>

# Force Ollama to stay in memory so it doesn't "cold start" next time
spring.ai.ollama.chat.options.keep-alive=24h
spring.ai.ollama.chat.options.temperature=0.0
spring.ai.ollama.chat.options.repeat-penalty=1.1
spring.ai.ollama.chat.options.num-ctx=4096
