
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitGrok | Java Code Auditor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
          --ink: #0d1117;
          --panel: #161b22;
          --panel-alt: #1f242d;
          --border: #30363d;
          --text: #e6edf3;
          --text-muted: #8b949e;
          --accent: #d97706;
          --accent-glow: rgba(217, 119, 6, 0.15);
          --ok: #3fb950;
          --radius: 6px;
        }

        * { box-sizing: border-box; }

        body {
          margin: 0;
          height: 100vh;
          display: flex;
          justify-content: center;
          align-items: center;
          /* Sub-surface grid + ambient radial glow for an IDE visualizer background */
          background-color: #07090c;
          background-image: 
            radial-gradient(circle at 50% 0%, #1c2333 0%, transparent 75%),
            linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
            linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
          background-size: 100% 100%, 24px 24px, 24px 24px;
          font-family: 'Inter', -apple-system, sans-serif;
          color: var(--text);
        }

        .app {
          width: 100%;
          max-width: 820px;
          height: 90vh;
          background: var(--ink);
          border: 1px solid var(--border);
          border-radius: 10px;
          display: flex;
          flex-direction: column;
          overflow: hidden;
          box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
        }

        /* ---- Header ---- */
        .header {
          padding: 12px 18px;
          background: var(--panel);
          border-bottom: 1px solid var(--border);
          display: flex;
          align-items: center;
          justify-content: space-between;
        }

        .brand {
          display: flex;
          align-items: center;
          gap: 12px;
        }

        .brand-icon {
          font-family: 'IBM Plex Mono', monospace;
          background: var(--accent-glow);
          color: var(--accent);
          border: 1px solid rgba(217, 119, 6, 0.3);
          padding: 3px 7px;
          border-radius: 4px;
          font-weight: 600;
          font-size: 0.8rem;
        }

        .brand-mark {
          font-family: 'IBM Plex Mono', monospace;
          font-size: 0.92rem;
          font-weight: 600;
          color: var(--text);
          letter-spacing: -0.3px;
        }

        .brand-sub {
          font-size: 0.8rem;
          color: var(--text-muted);
        }

        .index-status {
          display: flex;
          align-items: center;
          gap: 7px;
          font-family: 'IBM Plex Mono', monospace;
          font-size: 0.74rem;
          color: var(--ok);
        }

        .index-status .dot {
          width: 6px;
          height: 6px;
          border-radius: 50%;
          background: var(--ok);
          box-shadow: 0 0 8px var(--ok);
        }

        @media (max-width: 520px) {
          .brand-sub { display: none; }
        }

        /* ---- Chat area ---- */
        #chat-box {
          flex: 1;
          overflow-y: auto;
          padding: 20px;
          display: flex;
          flex-direction: column;
          gap: 16px;
        }

        #chat-box::-webkit-scrollbar { width: 6px; }
        #chat-box::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

        .row {
          display: flex;
          flex-direction: column;
          gap: 6px;
          animation: rise 0.15s ease-out;
        }

        @keyframes rise {
          from { opacity: 0; transform: translateY(4px); }
          to { opacity: 1; transform: translateY(0); }
        }

        .bubble {
          font-size: 0.92rem;
          line-height: 1.6;
          white-space: pre-wrap;
          word-wrap: break-word;
          max-width: 90%;
        }

        .row.user { align-items: flex-end; }

        .row.user .bubble {
          color: var(--text);
          padding: 10px 14px;
          background: var(--panel-alt);
          border: 1px solid var(--border);
          border-radius: var(--radius);
          border-bottom-right-radius: 2px;
        }

        .row.grok .bubble {
          color: var(--text);
          background: transparent;
        }

        .row.grok.pending .bubble {
          color: var(--text-muted);
          font-family: 'IBM Plex Mono', monospace;
          font-size: 0.82rem;
        }

        .cursor::after {
          content: '▋';
          color: var(--accent);
          animation: blink 0.9s step-start infinite;
          margin-left: 2px;
        }

        @keyframes blink { 50% { opacity: 0; } }

        /* ---- Welcome Card ---- */
        .welcome-card {
          background: var(--panel);
          border: 1px solid var(--border);
          border-left: 3px solid var(--accent);
          border-radius: var(--radius);
          padding: 16px;
          display: flex;
          flex-direction: column;
          gap: 10px;
        }

        .welcome-title {
          font-family: 'IBM Plex Mono', monospace;
          font-size: 0.88rem;
          font-weight: 600;
          color: var(--text);
        }

        .welcome-desc {
          color: var(--text-muted);
          font-size: 0.86rem;
        }

        .quick-prompts {
          display: flex;
          flex-wrap: wrap;
          gap: 8px;
          margin-top: 4px;
        }

        .prompt-chip {
          background: var(--panel-alt);
          border: 1px solid var(--border);
          color: var(--text);
          font-family: 'IBM Plex Mono', monospace;
          font-size: 0.76rem;
          padding: 6px 10px;
          border-radius: 4px;
          cursor: pointer;
          transition: all 0.15s ease;
        }

        .prompt-chip:hover {
          border-color: var(--accent);
          background: var(--accent-glow);
          color: var(--accent);
        }

        /* ---- Code blocks inside responses ---- */
        .code-block {
          margin: 10px 0;
          background: #090c10;
          border: 1px solid var(--border);
          border-radius: var(--radius);
          overflow: hidden;
        }

        .code-block-header {
          display: flex;
          justify-content: space-between;
          align-items: center;
          padding: 6px 12px;
          background: var(--panel);
          border-bottom: 1px solid var(--border);
          font-family: 'IBM Plex Mono', monospace;
          font-size: 0.72rem;
          color: var(--text-muted);
        }

        .copy-btn {
          background: none;
          border: 1px solid var(--border);
          color: var(--text-muted);
          font-family: 'IBM Plex Mono', monospace;
          font-size: 0.7rem;
          padding: 2px 8px;
          border-radius: 4px;
          cursor: pointer;
        }
        .copy-btn:hover { color: var(--text); border-color: var(--text-muted); }

        .code-block pre {
          margin: 0;
          padding: 12px 14px;
          overflow-x: auto;
          font-family: 'IBM Plex Mono', monospace;
          font-size: 0.83rem;
          line-height: 1.5;
          white-space: pre;
          color: #7ee787;
        }

        .inline-code {
          font-family: 'IBM Plex Mono', monospace;
          background: var(--panel-alt);
          border: 1px solid var(--border);
          border-radius: 4px;
          padding: 1px 5px;
          font-size: 0.85em;
          color: #f0883e;
        }

        /* ---- Input area ---- */
        .input-container {
          padding: 14px 16px;
          background: var(--panel);
          border-top: 1px solid var(--border);
        }

        .input-area {
          display: flex;
          align-items: flex-end;
          gap: 10px;
          background: var(--ink);
          border: 1px solid var(--border);
          border-radius: var(--radius);
          padding: 8px 12px;
        }

        .input-area:focus-within {
          border-color: var(--accent);
        }

        .prompt-mark {
          font-family: 'IBM Plex Mono', monospace;
          color: var(--accent);
          font-size: 0.95rem;
          padding-bottom: 6px;
        }

        textarea#userInput {
          flex: 1;
          resize: none;
          max-height: 120px;
          background: transparent;
          border: none;
          outline: none;
          color: var(--text);
          font-family: 'Inter', sans-serif;
          font-size: 0.90rem;
          padding: 4px 0;
          line-height: 1.4;
        }
        textarea#userInput::placeholder { color: var(--text-muted); }

        button#sendBtn {
          background: var(--accent);
          color: #0d1117;
          border: none;
          font-family: 'IBM Plex Mono', monospace;
          font-weight: 600;
          font-size: 0.8rem;
          padding: 6px 14px;
          border-radius: 4px;
          cursor: pointer;
        }
        button#sendBtn:disabled { opacity: 0.4; cursor: default; }
        button#sendBtn:not(:disabled):hover { background: #f59e0b; }
    </style>
</head>
<body>

<div class="app">
    <div class="header">
        <div class="brand">
            <span class="brand-icon">AST</span>
            <span class="brand-mark">GitGrok</span>
            <span class="brand-sub">Java Source Auditor</span>
        </div>
        <div class="index-status"><span class="dot"></span>Context Active</div>
    </div>

    <div id="chat-box">
        <div class="row grok">
            <div class="bubble">
                <div class="welcome-card">
                    <div class="welcome-title">Source Index Ready</div>
                    <div class="welcome-desc">Strict code verification active. Select a quick query pattern or type your audit question below:</div>
                    <div class="quick-prompts">
                        <button class="prompt-chip" onclick="fillPrompt('Give me the methods from this file VetRestControllerV1.java')">REST Endpoints</button>
                        <button class="prompt-chip" onclick="fillPrompt('What beans are configured in BasicAuthenticationConfig.java')">Bean Configs</button>
                        <button class="prompt-chip" onclick="fillPrompt('Show data operations in VetRepository.java')">Data Access</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="input-container">
        <div class="input-area">
            <span class="prompt-mark">›</span>
            <textarea id="userInput" rows="1" placeholder="Query endpoints, models, or bean configurations..."></textarea>
            <button id="sendBtn" onclick="sendMessage()">Run Audit</button>
        </div>
    </div>
</div>

<script>
    const input = document.getElementById('userInput');
    const chatBox = document.getElementById('chat-box');
    const sendBtn = document.getElementById('sendBtn');

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    input.addEventListener('input', () => {
      input.style.height = 'auto';
      input.style.height = Math.min(input.scrollHeight, 120) + 'px';
    });

    function fillPrompt(text) {
      input.value = text;
      input.style.height = 'auto';
      input.style.height = Math.min(input.scrollHeight, 120) + 'px';
      input.focus();
    }

    function isNearBottom() {
      return chatBox.scrollHeight - chatBox.scrollTop - chatBox.clientHeight < 60;
    }

    function scrollToBottom() {
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function escapeHtml(str) {
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function formatContent(raw) {
      let text = escapeHtml(raw);
      text = text.replace(/```(\w+)?\n([\s\S]*?)```/g, (_, lang, code) => {
        const label = lang || 'java';
        return `<div class="code-block">
          <div class="code-block-header"><span>${label}</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div>
          <pre><code>${code}</code></pre>
        </div>`;
      });
      text = text.replace(/`([^`]+)`/g, '<code class="inline-code">$1</code>');
      return text;
    }

    function copyCode(btn) {
      const code = btn.closest('.code-block').querySelector('code').textContent;
      navigator.clipboard.writeText(code).then(() => {
        const original = btn.textContent;
        btn.textContent = 'Copied';
        setTimeout(() => { btn.textContent = original; }, 1200);
      });
    }

    function sendMessage() {
      const message = input.value.trim();
      if (!message) return;

      const wasNearBottom = isNearBottom();

      chatBox.insertAdjacentHTML('beforeend', `
        <div class="row user">
          <div class="bubble">${escapeHtml(message)}</div>
        </div>
      `);

      const rowId = 'row-' + Date.now();
      chatBox.insertAdjacentHTML('beforeend', `
        <div class="row grok pending" id="${rowId}">
          <div class="bubble">Scanning index context...</div>
        </div>
      `);

      const row = document.getElementById(rowId);
      const bubble = row.querySelector('.bubble');
      if (wasNearBottom) scrollToBottom();

      input.value = "";
      input.style.height = 'auto';
      input.disabled = true;
      sendBtn.disabled = true;

      let raw = "";
      let receivedAny = false;

      const eventSource = new EventSource(`/chat?message=${encodeURIComponent(message)}`);

      eventSource.onmessage = (event) => {
        if (!receivedAny) {
          receivedAny = true;
          row.classList.remove('pending');
          bubble.classList.add('cursor');
        }
        raw += event.data;
        bubble.innerHTML = formatContent(raw);
        if (isNearBottom()) scrollToBottom();
      };

      eventSource.onerror = () => {
        if (!receivedAny) {
          row.classList.remove('pending');
          bubble.textContent = "Unable to complete vector query. Verify Ollama or index status.";
        } else if (eventSource.readyState === EventSource.CLOSED) {
          bubble.innerHTML += '<br><span style="color:#f85149;font-size:0.78em;font-family:\'IBM Plex Mono\',monospace;">[stream connection terminated]</span>';
        }
        finish();
      };

      function finish() {
        bubble.classList.remove('cursor');
        eventSource.close();
        input.disabled = false;
        sendBtn.disabled = false;
        input.focus();
      }
    }
</script>
</body>
</html>
